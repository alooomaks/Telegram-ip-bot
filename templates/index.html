<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Web App</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 40px 20px;
            background: #f5f5f5;
        }

        .box {
            max-width: 400px;
            margin: auto;
            padding: 30px;
            background: white;
            border-radius: 20px;
        }
    </style>
</head>

<body>

<div class="box">

    <h2>Добро пожаловать</h2>

    <p>
        Для работы сайта фиксируется IP-адрес вашего подключения.
    </p>

    <p>
        Ваш IP:
        <strong>{{ ip }}</strong>
    </p>

</div>

<script>
    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();
</script>

</body>

</html>
